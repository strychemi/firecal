# Continent of each FIRMS country file, for the global run (PREREGISTRATION.md §4 and §7).
# Based on the UN M49 regions: Africa; Asia; Europe; Oceania; the Americas split into North America
# (Northern America, Central America and the Caribbean) and South America. Antarctica and the far southern
# islands form their own group. One exception to M49: the Russian Federation is split at 60° E (roughly the
# Urals), west to Europe and east to Asia, because most of its fires burn in Siberia.
# Names are exactly as in the FIRMS file names.

split_at_lon = { Russian_Federation = { west = "Europe", east = "Asia", lon = 60.0 } }

