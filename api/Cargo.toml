[package]
name = "firecal-api"
version = "0.1.0"
description = "firecal API: serves the harmonized MODIS/VIIRS burning calendar. Written with AI assistance (Claude Code); see AI_LOG.md."
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
duckdb = { version = "1.20000.2", features = ["bundled"] }
geo = "0.33.1"
h3o = { version = "0.11.1", features = ["geo"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
toml = "1.2.1"
tower-http = { version = "0.7.1", features = ["fs", "compression-gzip", "trace"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
