[project]
name = "firecal-pipeline"
version = "0.1.0"
description = "Harmonize FIRMS MODIS and VIIRS hotspots into a burning-activity calendar"
requires-python = ">=3.13"
dependencies = [
  "duckdb>=1.1",
  "pandas>=2.2",
  "numpy>=2.0",
  "pyarrow>=17",
  "h3>=4.1",
]

[project.scripts]
firecal = "firecal_pipeline.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["firecal_pipeline"]
